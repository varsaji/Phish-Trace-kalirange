name: Bug report
description: Something is wrong or confusing in PhishTrace
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real emails.** They can contain personal data. Remove names, addresses and links, or reproduce the problem with a synthetic email.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      placeholder: phishtrace analyze samples/03_fake_bank_login.eml
  - type: input
    id: version
    attributes:
      label: PhishTrace version and operating system
      placeholder: "phishtrace 1.1.0, macOS 15"
